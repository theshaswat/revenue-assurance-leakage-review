name: tests

# Runs the reconciliation against a small hand-built set of orders where each leakage
# type has one planted case, and asserts it finds exactly those amounts. This proves
# the reconciliation logic, not the result on the full Olist data: that dataset is not
# redistributed here (CC BY-NC-SA 4.0) and is checked locally against the published
# totals in the report.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
